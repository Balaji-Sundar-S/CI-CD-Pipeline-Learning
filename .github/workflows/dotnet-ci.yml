name: .NET CI/CD with SonarQube and Coverage

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "main", "develop" ]

jobs:
  build-test-analyze:
    name: Build, Test, Coverage and Analyze
    runs-on: windows-latest
    
    steps:
    # Setup Java (required for SonarQube)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'zulu'
    
    # Checkout code
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    # Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    # Cache SonarQube packages
    - name: Cache SonarQube packages
      uses: actions/cache@v4
      with:
        path: ~\sonar\cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    
    # Cache SonarQube scanner
    - name: Cache SonarQube scanner
      id: cache-sonar-scanner
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}\scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner
    
    # Install SonarQube scanner
    - name: Install SonarQube scanner
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory -Force
        dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
    
    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore
    
    # Begin SonarQube analysis with coverage settings
    - name: Begin SonarQube analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      shell: powershell
      run: |
        ${{ runner.temp }}\scanner\dotnet-sonarscanner begin `
          /k:"Balaji-Sundar-S_CI-CD-Pipeline-Learning" `
          /o:"balaji-sundar-s" `
          /d:sonar.token="$env:SONAR_TOKEN" `
          /d:sonar.host.url="https://sonarcloud.io" `
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" `
          /d:sonar.coverage.exclusions="**/Program.cs,**/*.cshtml,**/wwwroot/**"
    
    # Build solution
    - name: Build solution
      run: dotnet build --configuration Release --no-restore
    
    # Run tests with code coverage
    - name: Run tests with coverage
      shell: powershell
      run: |
        dotnet test --configuration Release --no-build --verbosity normal `
          --collect:"XPlat Code Coverage" `
          --results-directory ./coverage `
          --logger "trx;LogFileName=test-results.trx" `
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
    
    # Display coverage results in console
    - name: Display coverage info
      shell: powershell
      run: |
        Write-Host "======================================"
        Write-Host "Code Coverage Report Generated"
        Write-Host "======================================"
        $coverageFiles = Get-ChildItem -Path ./coverage -Filter coverage.opencover.xml -Recurse
        if ($coverageFiles) {
            Write-Host "✅ Coverage files found:"
            $coverageFiles | ForEach-Object { Write-Host "   - $($_.FullName)" }
        } else {
            Write-Host "⚠️ No coverage files found"
        }
    
    # End SonarQube analysis (this uploads coverage to SonarCloud)
    - name: End SonarQube analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      shell: powershell
      run: |
        ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
    
    # Upload test results
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/test-results.trx'
    
    # Upload coverage reports
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: 'coverage/**/coverage.opencover.xml'